name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      # The version is the clock, so no one has to lift a version number.
      # The module is built here too, so no one installing the zip needs Go.
      - name: Version the plugin by the clock
        run: |
          version="$(TZ=Asia/Shanghai date +%Y%m%d-%H%M%S)"
          echo "version=$version" >> "$GITHUB_ENV"
          sed -i "s/^version: .*/version: $version/" plugin.yaml

      - name: Pack the plugin
        run: |
          make zip
          # A second copy under a name that never changes, so a site can
          # always take the latest with one address.
          cp "$(ls dist/*.zip | head -1)" "dist/$(basename "$(ls dist/*.zip | head -1)" | sed 's/-[0-9]\{8\}-[0-9]\{6\}\.zip$/-latest.zip/')"

      # Makes the tag itself, named after the clock, with the zip on it.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$version" dist/*.zip \
            --title "v$version" \
            --notes "Built from $GITHUB_SHA automatically."
