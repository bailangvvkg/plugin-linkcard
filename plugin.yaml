id: linkcard
name: Hyperlink Card
version: 0.1.0
apiVersion: kite/plugin/v1
requires: ">=0.1.0 <2.0.0"
description: >-
  Turns card code blocks into link cards in three sizes, like Halo's
  hyperlink card. Icons come from a favicon service, and missing titles
  and descriptions can be fetched in the reader's browser.
author:
  name: bailangvvkg
  url: https://blog.zipimg.cn
license: MIT
homepage: https://github.com/bailangvvkg/plugin-linkcard

# The plugin's scripts load favicons and link metadata from these sites.
hosts: [api.microlink.io, noembed.com, api.github.com, icon.horse, icons.duckduckgo.com, www.google.com]

# plugin.wasm draws the cards when a page is built; card.js fills in what
# the cards are missing, fetching only what the settings allow.
hooks: [transform_html]

inject:
  - at: head
    html: |
      <link rel="stylesheet" href="{{ asset "card.css" }}">
  - at: body
    html: |
      <script>window.KiteLinkCard = {settings: {{ .Settings }}};</script>
      <script src="{{ asset "card.js" }}" defer></script>

settings:
  - key: default_size
    type: select
    label: Default size
    help: The size of a card whose block does not give one.
    default: regular
    options:
      - {value: small, label: Small}
      - {value: regular, label: Regular}
      - {value: grid, label: Grid}
  - key: target
    type: select
    label: Open links in
    default: _blank
    options:
      - {value: _blank, label: A new tab}
      - {value: _self, label: The same tab}
  - key: fetch
    type: boolean
    label: Fetch missing metadata
    help: In the reader's browser, ask a link detail service for titles and descriptions a card does not give.
    default: true
  - key: api
    type: select
    label: Fetch from
    help: Where missing titles and descriptions come from. Microlink is a free public API with a daily limit.
    default: microlink
    showIf: {fetch: true}
    options:
      - {value: microlink, label: Microlink}
      - {value: custom, label: Custom endpoint}
  - key: api_url
    type: text
    label: Custom endpoint
    help: Read when Fetch from is Custom endpoint. Put {url} where the address goes, as https://api.example.com/link?url={url}; the reply is JSON with title, description, image and logo. When it answers nothing, the services below are asked instead.
    placeholder: https://api.example.com/link?url={url}
    showIf: {fetch: true, api: custom}
  - key: github
    type: boolean
    label: Ask GitHub itself
    help: A card of a GitHub repository is asked of GitHub's own API, which answers any browser without a key, with the name, the description and the owner's picture, through no third party.
    default: true
    showIf: {fetch: true}
  - key: noembed
    type: boolean
    label: Ask Noembed for video and social sites
    help: Noembed answers for the sites that speak oEmbed — YouTube, Twitter and the like — without a key and without a limit, so these cards never spend another service's daily share.
    default: true
    showIf: {fetch: true}
  - key: microlink
    type: boolean
    label: Ask Microlink as the last resort
    help: Microlink answers for any site, free for about 50 questions a day from a reader's address; uncheck to keep a reader away from it even as a fallback.
    default: true
    showIf: {fetch: true}
  - key: cache
    type: boolean
    label: Cache what is fetched
    help: Keep fetched metadata in the reader's browser, so a card is fetched once.
    default: true
    showIf: {fetch: true}
  - key: links
    type: boolean
    label: Bare links as cards
    help: Links in a post whose text is just the address, as autolinks are, stand for cards too. Only the writing itself is touched, inside an article tag, never the menus and footers around it.
    default: true
  - key: icons
    type: select
    label: Favicon service
    help: Where the icon of a card that gives none comes from. Direct asks the linked site itself for its favicon, through no third party, and a site with its favicon nowhere usual shows none.
    default: duckduckgo
    options:
      - {value: duckduckgo, label: DuckDuckGo}
      - {value: google, label: Google}
      - {value: direct, label: Direct from the site}
      - {value: none, label: None}
  - key: horse
    type: boolean
    label: Icon Horse as the favicon fallback
    help: Icon Horse reads the linked site and hands its favicon over, free of key and quota, and finds favicons sitting on made-up paths; uncheck to keep every icon coming from the service chosen above only.
    default: true
